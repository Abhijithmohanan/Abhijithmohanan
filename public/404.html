<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Black Humor Productions</title>
  </head>
  <body>
    <p>Taking you back to the site…</p>
    <script>
      const basePath = '__BASE_PATH__';
      const basePrefix = basePath === '/' ? '' : basePath.slice(0, -1);
      const routePath = location.pathname.startsWith(`${basePrefix}/`)
        ? location.pathname.slice(basePrefix.length)
        : location.pathname;
      const requestedPath = `${routePath}${location.search}${location.hash}`;
      location.replace(`${basePath}?__route=${encodeURIComponent(requestedPath)}`);
    </script>
    <noscript>
      <a href="__BASE_PATH__">Return to the home page.</a>
    </noscript>
  </body>
</html>
