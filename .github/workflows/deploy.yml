name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Set site base path
        run: |
          if [ -f CNAME ]; then
            site_base="/"
          else
            site_base="/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "VITE_BASE_PATH=${site_base}" >> "$GITHUB_ENV"
      - name: Build website
        run: npm run build
      - name: Configure Pages files
        run: |
          if [ -f CNAME ]; then cp CNAME dist/CNAME; fi
          sed "s|__BASE_PATH__|${VITE_BASE_PATH}|g" public/404.html > dist/404.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
